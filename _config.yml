title: Homepage
author: Kevin Rudolf Siebert
email: k.r.siebert@icloud.com
description: >-
  Personal homepage of Kevin Rudolf Siebert — physicist and part-time
  machine learning engineer based in Jena, Germany.
url: "https://i-am-rudi.github.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title.html

# Social / nav metadata used in templates
github_user: I-am-Rudi

# Blog is hidden for now. To re-enable: set show_blog to true and remove
# blog.md and _posts from the exclude list below.
show_blog: false

exclude:
  - blog.md
  - _posts
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
