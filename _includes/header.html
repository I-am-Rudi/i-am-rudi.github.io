{% assign u = page.url %}
<header class="nav">
  <a class="wordmark" href="{{ '/' | relative_url }}">Rudi Siebert</a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}"{% if u == '/' %} class="active"{% endif %}>HOME</a>
      <a href="{{ '/cv/' | relative_url }}"{% if u contains '/cv' %} class="active"{% endif %}>CV</a>
      <a href="{{ '/blog/' | relative_url }}"{% if u contains '/blog' or page.layout == 'post' %} class="active"{% endif %}>BLOG</a>
      <a href="{{ '/about/' | relative_url }}"{% if u contains '/about' %} class="active"{% endif %}>ABOUT</a>
    </nav>
    <button class="theme-switch" type="button" data-theme-toggle aria-label="Toggle light / dark mode" title="Toggle light / dark mode"><span class="ts-moon"></span></button>
  </div>
</header>
