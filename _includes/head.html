<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    /* Auto-detect colour scheme, allow manual override via the nav switch,
       and remember the choice. Runs before paint to avoid a flash. */
    (function () {
      var KEY = 'rudi-theme';
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(t) { document.documentElement.setAttribute('data-theme', t); }
      apply(localStorage.getItem(KEY) || (mq.matches ? 'dark' : 'light'));
      if (mq.addEventListener) {
        mq.addEventListener('change', function (e) {
          if (!localStorage.getItem(KEY)) apply(e.matches ? 'dark' : 'light');
        });
      }
      document.addEventListener('click', function (e) {
        var t = e.target.closest && e.target.closest('[data-theme-toggle]');
        if (!t) return;
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem(KEY, next);
        apply(next);
      });
    })();
  </script>
</head>
